name: "Run vally eval"
description: >
  Sets up Node.js, installs eval dependencies, and runs `vally eval` against the
  given eval spec. The caller must check out the repository first. Shared by CI
  workflows that gate on vally eval results.

inputs:
  eval-file:
    description: Path to the eval spec (e.g. eval.yaml), relative to working-directory.
    required: false
    default: eval.yaml
  working-directory:
    description: Directory containing package.json and the eval spec (vally eval.yaml).
    required: true
  node-version:
    description: Node.js version to set up
    required: false
    default: "24"
  junit:
    description: >
      Whether to pass `--junit` so vally writes eval-results.junit.xml alongside
      the other output files.
    required: false
    default: "true"
  github-token:
    description: >
      Token used to authenticate the Copilot CLI process vally spawns.
      Callers typically pass github.token (requires the
      `copilot-requests: write` permission).
    required: true
  artifact-name:
    description: >
      Name of the uploaded artifact containing vally-results/. Required and
      used as the artifact name and job summary heading. Callers can derive it
      from the job name, for example "<job>-vally-results".
    required: true
  install-azd:
    description: >
      Whether to install the released azd CLI. Needed by evals that shell out to `azd`.
    required: false
    default: "false"
  azd-extensions:
    description: >
      Space-separated azd extension ids to install, optionally pinned as
      "<id>@<version>" (for example "microsoft.foundry@1.0.0-beta.2").
      Implies install-azd.
    required: false
    default: ""
  fetch-skills:
    description: >
      Whether to run scripts/fetch-foundry-skill.mjs before the eval. Needed by evals
      that load a skill from skills/.external/.
    required: false
    default: "false"

outputs:
  vally-exit-code:
    description: Exit code of the `vally eval` invocation.
    value: ${{ steps.run.outputs.vally-exit-code }}
  vally-run-dir:
    description: Absolute path to the timestamped run directory produced by the eval.
    value: ${{ steps.run.outputs.vally-run-dir }}

runs:
  using: composite
  steps:
    - name: Check Copilot availability
      id: copilot
      shell: bash
      env:
        COPILOT_ENABLED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      run: |
        echo "enabled=$COPILOT_ENABLED" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      if: steps.copilot.outputs.enabled == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Set up Go
      if: steps.copilot.outputs.enabled == 'true'
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
      with:
        go-version-file: ${{ inputs.working-directory }}/go.mod

    - name: Test report generator
      if: steps.copilot.outputs.enabled == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go test ./...

    - name: Install eval dependencies
      if: steps.copilot.outputs.enabled == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    # Keep installed extensions and auth state in a job-local dir so a run never
    # touches or depends on persistent runner state.
    - name: Configure azd environment
      if: steps.copilot.outputs.enabled == 'true' && (inputs.install-azd == 'true' || inputs.azd-extensions != '')
      shell: bash
      run: |
        azd_config_dir="$RUNNER_TEMP/azd-config"
        mkdir -p "$azd_config_dir"
        {
          echo "AZD_CONFIG_DIR=$azd_config_dir"
          echo "AZURE_DEV_COLLECT_TELEMETRY=no"
          echo "NO_COLOR=1"
        } >> "$GITHUB_ENV"

    - name: Install azd
      if: steps.copilot.outputs.enabled == 'true' && (inputs.install-azd == 'true' || inputs.azd-extensions != '')
      shell: bash
      run: |
        curl -fsSL https://aka.ms/install-azd.sh | bash
        azd version

    - name: Install azd extensions
      if: steps.copilot.outputs.enabled == 'true' && inputs.azd-extensions != ''
      shell: bash
      env:
        AZD_EXTENSIONS: ${{ inputs.azd-extensions }}
      run: |
        for spec in $AZD_EXTENSIONS; do
          # "<id>" or "<id>@<version>"
          id="${spec%@*}"
          version=""
          [[ "$spec" == *@* ]] && version="${spec##*@}"

          if [[ -n "$version" ]]; then
            azd extension install "$id" --version "$version" --no-prompt
          else
            azd extension install "$id" --no-prompt
          fi
        done
        azd extension list --installed

    - name: Fetch external skills
      if: steps.copilot.outputs.enabled == 'true' && inputs.fetch-skills == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        node ./scripts/fetch-foundry-skill.mjs
        cat skills/.external/.skill-ref

    - name: Run vally eval
      id: run
      if: steps.copilot.outputs.enabled == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        JUNIT: ${{ inputs.junit }}
        EVAL_FILE: ${{ inputs.eval-file }}
      run: |
        junit_flag=""
        [[ "$JUNIT" == "true" ]] && junit_flag="--junit"
        set +e
        npx vally eval -e "$EVAL_FILE" $junit_flag
        exit_code=$?
        set -e
        echo "vally-exit-code=$exit_code" >> "$GITHUB_OUTPUT"

        # vally always writes results into a single timestamped subdirectory of
        # vally-results/. There's only a single run here, so we'll resolve it once
        # and export that value as 'vally-run-dir'.
        #
        run_dir=$(find vally-results -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -n1)
        run_dir=${run_dir:-vally-results}
        echo "vally-run-dir=$(pwd)/$run_dir" >> "$GITHUB_OUTPUT"

    # The skill tracks another repo's default branch, so record which commit this run
    # saw -- otherwise the results artifact can't be tied back to it.
    - name: Capture skill provenance
      if: always() && steps.copilot.outputs.enabled == 'true' && inputs.fetch-skills == 'true' && steps.run.outputs.vally-run-dir != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VALLY_RUN_DIR: ${{ steps.run.outputs.vally-run-dir }}
      run: |
        if [[ -d "$VALLY_RUN_DIR" && -f skills/.external/.skill-ref ]]; then
          cp skills/.external/.skill-ref "$VALLY_RUN_DIR/skill-ref.txt"
        fi

    - name: Generate vally report
      if: always() && steps.copilot.outputs.enabled == 'true' && steps.run.outputs.vally-run-dir != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VALLY_RUN_DIR: ${{ steps.run.outputs.vally-run-dir }}
      run: |
        if [[ -d "$VALLY_RUN_DIR" ]]; then
          npm run report -- --output-dir "$VALLY_RUN_DIR/vally_report"
        fi

    - name: Write job summary
      if: always() && steps.copilot.outputs.enabled == 'true'
      shell: bash
      env:
        VALLY_RUN_DIR: ${{ steps.run.outputs.vally-run-dir }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        {
          echo "### Vally eval results -- $ARTIFACT_NAME"
          echo
          md_file="$VALLY_RUN_DIR/eval-results.md"
          if [[ -f "$md_file" ]]; then
            cat "$md_file"
          else
            echo "_No eval-results.md found -- see the vally-results artifact and raw output above._"
          fi
          echo
          echo "--------------------------------------------------------------------------------"
          echo "Additional reports generated by vally_report.go are in \`$VALLY_RUN_DIR/vally_report/\` in the artifact."
          echo "--------------------------------------------------------------------------------"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload vally results
      if: always() && steps.copilot.outputs.enabled == 'true' && steps.run.outputs.vally-run-dir != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.vally-run-dir }}/**
        if-no-files-found: warn

    - name: Propagate vally result
      if: always() && steps.copilot.outputs.enabled == 'true'
      shell: bash
      env:
        VALLY_EXIT_CODE: ${{ steps.run.outputs.vally-exit-code }}
      run: |
        if [[ -z "$VALLY_EXIT_CODE" ]]; then
          echo "::error::Vally did not run -- check the preceding setup and test steps."
          exit 1
        fi

        if [[ "$VALLY_EXIT_CODE" -ne 0 ]]; then
          echo "::error::npx vally eval failed with exit code $VALLY_EXIT_CODE -- see the 'Run vally eval' log above."
          exit 1
        fi

    - name: Reject PRs from forks
      if: always() && steps.copilot.outputs.enabled != 'true'
      shell: bash
      run: |
        echo "::error::Vally evals cannot run for fork pull requests because Copilot request permission is unavailable."
        exit 1
