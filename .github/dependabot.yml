version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/vally-eval"
      - "/cli/azd/extensions/azure.coding-agent/internal/cmd/templates"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Keep gh-aw action pins in sync with the compiler that generates the workflows.
    ignore:
      - dependency-name: "github/gh-aw-actions/*"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directories:
      - "/.github/scripts"
      - "/ext/vscode"
      - "/ext/azuredevops/setupAzd"
      - "/cli/azd/test/evals"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
