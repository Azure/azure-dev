name: extension-user-contract-review-eval
# Run from the repository root so program graders can locate review-grader.cjs.
description: Exercise the parent PR reviewer so contract invocation, triage, and final comments are tested together.
skill: azd-code-reviewer
schemaVersion: "1.4"
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: auto
  skill_directories:
    - ../../azd-code-reviewer
    - ..
  required_skills:
    - azd-code-reviewer
    - extension-user-contract-review
  instruction_files:
    - harness.instructions.md
    - cli/azd/AGENTS.md
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
    description: All contract detection, deduplication, anchoring, and completion assertions must pass.
graders:
  - type: behavior
    name: bounded-review
    config:
      max_tool_calls: 60
  - type: program
    name: review-shape
    config:
      command: node
      # Extract a complete review object despite leading diagnostics and trailing logs.
      args:
        - .github/skills/extension-user-contract-review/evals/review-grader.cjs
        - --self-test
        - "typeof review.body === 'string'"
        - "Array.isArray(review.comments)"
        - "review.comments.every(c => typeof c.path === 'string' && Number.isInteger(c.line) && typeof c.body === 'string')"
        - "review.comments.every(c => c.side === 'RIGHT' || c.side === 'LEFT')"
tasks:
  - "tasks/*.yaml"
