id: missing-history
name: Missing review history cannot become a clean review or invented spec request
tags: [negative, blocked]
inputs:
  prompt: |
    Review this synthetic PR. Complete metadata: title "Output format".
    Complete changed-file list: cli/azd/extensions/example/internal/cmd/list.go.
    Complete before behavior: list prints a table.
    Complete after behavior: --format table|json selects validated machine output; all tests and docs match.
    Added RIGHT line 42: cmd.Flags().StringVar(&format, "format", "table", "Output format")
    Review history retrieval failed with access denied. It is not known whether existing contract threads or approved
    spec replies exist. The harness has no additional history or tools capable of retrieving it.
graders:
  - type: program
    name: explicit-evidence-blocker
    config:
      command: node
      args:
        - .github/skills/extension-user-contract-review/evals/review-grader.cjs
        - "review.comments.length === 0"
        - "/Extension user-contract review: blocked/i.test(review.body)"
        - "/history|access denied/i.test(review.body)"
        - "!review.body.includes('Extension user-contract review: complete')"
