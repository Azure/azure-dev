name: cli-ci
# cspell:ignore bufbuild

on:
  pull_request:
    paths:
      - "cli/**"
      - "!cli/azd/extensions/**"
      - ".github/workflows/cli-ci.yml"
      - "eng/scripts/Get-CoverageDiff*.ps1"
      - "eng/scripts/Set-ExtensionVersionVariable*.ps1"
    branches: [main]

# If two events are triggered within a short time in the same PR, cancel the run of the oldest event
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  azd-lint:
    uses: ./.github/workflows/lint-go.yml
    with:
      working-directory: cli/azd

  cspell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
      - run: npm install -g cspell@8.13.1
      - name: Spell check for go and docs
        working-directory: cli/azd
        run: cspell lint '**/*.go' '**/*.md' --exclude 'extensions/**' --config ./.vscode/cspell.yaml --no-progress

  Copyright-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Copyright check
        run: ./eng/scripts/copyright-check.sh ./cli/azd

  bicep-lint:
    uses: ./.github/workflows/lint-bicep.yml

  coverage-script-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run Pester tests for engineering scripts
        shell: pwsh
        run: |
          # Pin Pester to a specific signed release for deterministic, supply-chain-safe installs.
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = @(
            './eng/scripts/Get-CoverageDiff.Tests.ps1'
            './eng/scripts/Set-ExtensionVersionVariable.Tests.ps1'
          )
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  magefile-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: cli/azd/go.mod
      - name: Run mage helper tests
        working-directory: cli/azd
        run: go test -tags mage -run '^Test(Resolve|DependencyVersion|ProtoContainerRuntime)' -v .

  proto-contract-compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/azd/go.mod
      - name: Install Buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0
      - name: Regenerate protobuf artifacts
        working-directory: cli/azd
        run: go tool mage generateProtos
      - name: Verify generated protobuf artifacts are current
        run: git diff --exit-code
      - name: Lint protobuf contracts
        working-directory: cli/azd
        run: make proto-lint
      - name: Verify v1 is compatible with v1beta
        working-directory: cli/azd
        run: make proto-version-compatibility
      - name: Check protobuf history for breaking changes
        working-directory: cli/azd
        run: |
          if git cat-file -e origin/main:cli/azd/grpc/proto/azd/extensions/v1 2>/dev/null; then
            git branch --force buf-contract-baseline origin/main
            make proto-breaking BUF_BREAKING_AGAINST='../../.git#branch=buf-contract-baseline,subdir=cli/azd/grpc'
          else
            echo "Bootstrapping the versioned-contract baseline; historical comparison starts after this PR merges."
          fi
