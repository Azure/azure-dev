name: Evaluation candidate CLI proof (offline)

on:
  push:
    branches:
      - m7md7sien-evaluation-github-actions-proof
    paths:
      - .github/workflows/eval-candidate-proof.yml
      - eng/scripts/eval-candidate-proof/**
      - eng/scripts/eval-scenario-ci/scenario.py
      - eng/scripts/eval-scenario-ci/test_candidate_approval.py
  workflow_dispatch:

permissions:
  contents: read

env:
  AZD_SCENARIO_APPROVAL_REPOSITORY: ${{ github.repository }}
  AZD_SCENARIO_APPROVED_COMMIT: ${{ vars.AZD_SCENARIO_APPROVED_COMMIT }}

jobs:
  offline-cli:
    if: github.repository == 'm7md7sien/azure-dev'
    name: Offline CLI / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify independent candidate approval before binary execution
        id: approval
        shell: pwsh
        run: |
          python eng/scripts/eval-scenario-ci/scenario.py candidate-approval --manifest eng/scripts/eval-candidate-proof/candidate.json --output "$env:RUNNER_TEMP/candidate-approval"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish binary admission receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-approval-cli-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-approval/
          if-no-files-found: error
          retention-days: 14

      - name: Install pinned artifacts and exercise actual azd commands
        shell: pwsh
        run: |
          python eng/scripts/eval-candidate-proof/verify.py --output "$env:RUNNER_TEMP/eval-proof-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish sanitized offline evidence
        if: always() && steps.approval.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-cli-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eval-proof-evidence/
          if-no-files-found: error
          retention-days: 14

  source-race:
    if: github.repository == 'm7md7sien/azure-dev'
    name: Race tests / ${{ matrix.extension }}
    strategy:
      fail-fast: false
      matrix:
        extension: [evaluations, dataset]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NO_COLOR: "1"
      AZURE_DEV_COLLECT_TELEMETRY: "no"
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
    steps:
      - name: Checkout validation manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify independent candidate approval before source checkout
        id: source
        shell: python
        run: |
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("eng/scripts/eval-scenario-ci").resolve()))
          import scenario
          pin = scenario.approve_candidate(
              Path("eng/scripts/eval-candidate-proof/candidate.json"),
              Path(os.environ["RUNNER_TEMP"]) / "candidate-approval")
          commit = pin["sourceVerificationCommit"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"commit={commit}\n")

      - name: Publish source admission receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-approval-source-${{ matrix.extension }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-approval/
          if-no-files-found: error
          retention-days: 14

      - name: Checkout exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: m7md7sien/azure-dev
          ref: ${{ steps.source.outputs.commit }}
          path: candidate-source
          persist-credentials: false

      - name: Set up Go 1.26.4
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.4"
          cache: false

      - name: Verify checkout and Go version
        working-directory: candidate-source
        env:
          EXPECTED_SOURCE: ${{ steps.source.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(go env GOVERSION)" = "go1.26.4"
          go version

      - name: Run internal race tests without Azure credentials
        id: race
        working-directory: candidate-source/cli/azd/extensions/azure.ai.${{ matrix.extension }}
        run: |
          unset AZURE_AI_EVAL_E2E_LIVE
          go test -race -count=1 -timeout 15m ./internal/...

      - name: Record source proof scope and outcome
        if: always()
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          EXTENSION: ${{ matrix.extension }}
          RACE_OUTCOME: ${{ steps.race.outcome }}
        run: |
          {
            echo "## Source race tests: azure.ai.$EXTENSION"
            echo
            echo "- Immutable source: \`$SOURCE_COMMIT\`"
            echo "- Go: \`1.26.4\`"
            echo "- Command: \`go test -race -count=1 -timeout 15m ./internal/...\`"
            echo "- Outcome: **$RACE_OUTCOME**"
            echo "- Live cloud evaluation: **NOT RUN**; no Azure identity or live gate enabled."
          } >> "$GITHUB_STEP_SUMMARY"
