name: Installed evaluation scenarios (offline)

on:
  push:
    branches: [m7md7sien-evaluation-github-actions-proof]
    paths:
      - .github/workflows/eval-scenario-ci.yml
      - eng/scripts/eval-scenario-ci/**
      - eng/pipelines/eval-scenario-ci.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Offline proof, or a fail-closed report of blocked live prerequisites
        type: choice
        options: [offline, live]
        default: offline
  # GitHub delivers repository_dispatch only to workflows on the default branch.
  # Until adopted there, a release publisher can dispatch this workflow on its ref.
  repository_dispatch:
    types: [azd-bugbash-published]

permissions:
  contents: read

jobs:
  resolve:
    if: github.repository == 'm7md7sien/azure-dev' && inputs.mode != 'live'
    name: Freeze Latest once
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_name: ${{ steps.freeze.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test resolution, redaction and fail-closed live boundary
        run: python -m unittest discover -s eng/scripts/eval-scenario-ci -p 'test_*.py' -v
      - name: Resolve the public Latest release into immutable pins
        id: freeze
        env:
          PIN_ARTIFACT: scenario-pin-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python eng/scripts/eval-scenario-ci/scenario.py resolve --output "${{ runner.temp }}/scenario-pin/candidate.json"
          echo "artifact_name=$PIN_ARTIFACT" >> "$GITHUB_OUTPUT"
      - name: Share the single frozen manifest with both OS jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.freeze.outputs.artifact_name }}
          path: ${{ runner.temp }}/scenario-pin/
          if-no-files-found: error
          retention-days: 14

  offline:
    name: Installed offline scenarios / ${{ matrix.os }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.resolve.outputs.artifact_name }}
          path: ${{ runner.temp }}/scenario-pin/
      - name: Exercise actual installed bytes without Azure credentials
        shell: pwsh
        run: |
          python eng/scripts/eval-scenario-ci/scenario.py offline --manifest "$env:RUNNER_TEMP/scenario-pin/candidate.json" --output "$env:RUNNER_TEMP/scenario-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish sanitized offline results and explicit live blockers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenario-offline-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scenario-evidence/
          if-no-files-found: error
          retention-days: 14

  live-prerequisites:
    if: github.repository == 'm7md7sien/azure-dev' && inputs.mode == 'live'
    name: Requested live execution is BLOCKED
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail without an approved identity, resource and budget tuple
        run: python eng/scripts/eval-scenario-ci/scenario.py live --output "${{ runner.temp }}/scenario-live-blocked"
      - name: Preserve NOT RUN evidence even though the request failed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenario-live-blocked-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scenario-live-blocked/
          if-no-files-found: error
          retention-days: 14
