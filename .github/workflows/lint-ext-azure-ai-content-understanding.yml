name: ext-azure-ai-content-understanding-ci

on:
  pull_request:
    paths:
      - "cli/azd/extensions/azure.ai.content-understanding/**"
      - ".github/workflows/lint-ext-azure-ai-content-understanding.yml"
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    uses: ./.github/workflows/lint-go.yml
    with:
      working-directory: cli/azd/extensions/azure.ai.content-understanding
  lint-client:
    uses: ./.github/workflows/lint-go.yml
    with:
      working-directory: cli/azd/extensions/azure.ai.content-understanding/cu-rest-client
