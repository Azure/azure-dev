name: lint-go

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Path to the Go module directory to lint"
        required: true
        type: string
      go-version-file:
        description: "Path to go.mod to read Go version from"
        required: false
        type: string
        default: "cli/azd/go.mod"
      golangci-lint-version:
        description: "GolangCI-Lint version to use"
        required: false
        type: string
        default: "v2.11.4"

permissions:
  contents: read
  pull-requests: write

jobs:
  golangci-lint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}
          args: -v --timeout 10m0s
          working-directory: ${{ inputs.working-directory }}
          # Validate below with a local schema to avoid the verifier's two-second HTTP timeout.
          verify: false
      - name: Validate golangci-lint configuration
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          GOLANGCI_LINT_VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          SCHEMA_PATH="$RUNNER_TEMP/golangci-lint.schema.json"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            "https://raw.githubusercontent.com/golangci/golangci-lint/$GOLANGCI_LINT_VERSION/jsonschema/golangci.jsonschema.json" \
            --output "$SCHEMA_PATH"
          golangci-lint config verify --schema "$SCHEMA_PATH"

  go-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: Check for go fix suggestions
        working-directory: ${{ inputs.working-directory }}
        run: |
          STATUS=0
          DIFF=$(go fix -diff ./...) || STATUS=$?
          if [ -n "$DIFF" ]; then
            echo "::error::go fix found code that should be modernized."
            echo "Run 'go fix ./...' locally and commit the changes."
            echo ""
            echo "$DIFF"
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::go fix failed; see the diagnostics above."
            exit "$STATUS"
          fi
          echo "No go fix suggestions — code is up to date."
