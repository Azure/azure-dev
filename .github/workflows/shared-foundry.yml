name: shared-foundry-ci

on:
  pull_request:
    paths:
      - "cli/shared/**"
      - ".github/workflows/shared-foundry.yml"
    branches: [main]
  push:
    branches: [main]
    tags: ["cli/shared/foundry/v*"]
    paths:
      - "cli/shared/**"
      - ".github/workflows/shared-foundry.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    uses: ./.github/workflows/lint-go.yml
    with:
      working-directory: cli/shared/foundry
      go-version-file: cli/shared/foundry/go.mod

  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli/shared/foundry
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/shared/foundry/go.mod
          cache-dependency-path: cli/shared/foundry/go.sum
      - run: go mod download
      - run: go mod verify
      - run: python eng/check-boundaries.py
      - run: go build ./...
      - run: go test ./... -count=1 -cover
      - run: go vet ./...
      - name: Race tests
        if: runner.os == 'Linux'
        run: go test -race ./... -count=1
      - name: Setup Node for cspell
        if: runner.os == 'Linux'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install cspell
        if: runner.os == 'Linux'
        run: npm install -g cspell@8.13.1
      - name: Spelling
        if: runner.os == 'Linux'
        working-directory: .
        run: cspell lint "cli/shared/**/*.go" "cli/shared/**/*.md" --config cli/shared/foundry/cspell.yaml --no-progress
