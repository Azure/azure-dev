name: shared-foundry-ci

on:
  pull_request:
    paths:
      - "cli/shared/**"
      - ".github/workflows/shared-foundry.yml"
  push:
    branches: [main]
    tags: ["cli/shared/foundry/v*"]
    paths:
      - "cli/shared/**"
      - ".github/workflows/shared-foundry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli/shared/foundry
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/shared/foundry/go.mod
          cache-dependency-path: cli/shared/foundry/go.sum
      - run: go mod download
      - run: go mod verify
      - run: python eng/check-boundaries.py
      - run: go build ./...
      - run: go test ./... -count=1 -cover
      - run: go vet ./...
      - name: Race tests
        if: runner.os == 'Linux'
        run: go test -race ./... -count=1
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: cli/shared/foundry
          args: --timeout 5m
      - name: Spelling
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          npm ci --prefix eng/common/spelling
          eng/common/spelling/node_modules/.bin/cspell lint "cli/shared/**/*.go" "cli/shared/**/*.md" --config cli/shared/foundry/cspell.json --no-progress
