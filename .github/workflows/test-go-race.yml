name: test-go-race

on:
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "!cli/azd/extensions/**"
      - ".github/workflows/test-go-race.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  race-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli/azd
    env:
      CGO_ENABLED: "1"
      AZURE_RECORD_MODE: playback
      AZURE_DEV_COLLECT_TELEMETRY: "no"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: cli/azd/go.mod
          cache-dependency-path: cli/azd/go.sum
      - name: Build azd
        run: go build -o azd .
      - name: Run race detector tests
        run: go test -race -short -count=1 ./...
