# Tier 0 (offline) — verify root help lists every expected subcommand.
name: "help-root"
command: "azd ai agent --help"
cwd: "/tmp"
tags: ["tier:0", "cmd:help", "parallel-safe"]

goals:
  - "Wait for the help output to render (it includes an ASCII-art banner and a 'Usage:' section)."
  - "Confirm the 'Available Commands' list includes: code, delete, doctor, endpoint, eval, files, init, invocations, invoke, monitor, optimize, pack, publish, run, sample, sessions, show, version."
  - "Confirm the global flags are listed: --cwd/-C, --debug, --environment/-e, --no-prompt, --output/-o."
  - "Confirm the root description mentions hosted and voice agents, and the init, show, and delete command summaries mention voice agents."
  - "Run 'azd ai agent init --help'; confirm --kind and --voice are visible, --kind prompt-voice is demonstrated, and voice settings are described in azure.yaml with azd provision and azd deploy as the deployment workflow."
  - "Run 'azd ai agent deploy --help'; confirm it does not claim standalone voice deployment and instead directs voice users to azd provision and azd deploy."
  - "Run 'azd ai agent invoke --help'; confirm prompt voice and hosted voice wrapper users are directed to the Microsoft Foundry portal at https://ai.azure.com to try their agent, with Voice Live client guidance for programmatic access."
  - "Take a screenshot of the help output."
  - "Report a finding if any listed command is missing, if the usage text is malformed, or if the command exits non-zero."
