# Tier 0 (offline) — verify root help lists every expected subcommand.
name: "help-root"
command: "azd ai agent --help"
cwd: "/tmp"
tags: ["tier:0", "cmd:help", "parallel-safe"]

goals:
  - "Wait for the help output to render (it includes an ASCII-art banner and a 'Usage' section)."
  - "Confirm the 'Available Commands' list includes: code, delete, doctor, endpoint, eval, files, init, invocations, invoke, monitor, optimize, pack, publish, run, sample, sessions, show, version."
  - "Confirm the global flags are listed: --cwd/-C, --debug, --environment/-e, --no-prompt, --output/-o."
  - "Confirm the Environments & Environment Variables section explains .azure/<environment>/.env, azd env new/select/set/get-values, FOUNDRY_PROJECT_ENDPOINT, AGENT_<SERVICE> deployment values, and the service-level env mapping for runtime settings."
  - "Compare root, init, and files list help: headings should be consistently bold and underlined, command examples and flags highlighted, and usage paths start with azd ai agent. With NO_COLOR=1, the same content must remain readable without escape sequences."
  - "Confirm the root description mentions hosted and voice agents, and the init, show, and delete command summaries mention voice agents."
  - "Run 'azd ai agent init --help'; confirm --kind and --voice are visible, --kind prompt-voice is demonstrated, and voice settings are described in azure.yaml with azd provision and azd deploy as the deployment workflow."
  - "Confirm init help states --voice is rejected for other init flows and directs existing voice settings to azure.yaml; voice deployment uses azd provision and azd deploy."
  - "Run 'azd ai agent invoke --help'; confirm prompt voice and hosted voice wrapper users are directed to the Microsoft Foundry portal at https://ai.azure.com to try their agent, with Voice Live client guidance for programmatic access."
  - "Run 'azd ai agent init --kind hosted --voice en-US-AvaNeural' and 'azd ai agent init -m azure.yaml --voice en-US-AvaNeural'; each must reject --voice with new-prompt-voice guidance before authentication, downloading files, or changing the project."
  - "Run 'azd ai agent init --kind prompt-voice --agent-name voice-check --runtime python_3_13' and 'azd ai agent init --voice en-US-AvaNeural --src .'; both must reject the unused source/code inputs before authentication or project changes, even though the values are valid for hosted init."
  - "Take a screenshot of the help output."
  - "Report a finding if any listed command is missing, usage is malformed, or a help command exits non-zero. All deliberate invalid-input commands must exit non-zero with the expected guidance; report a finding if any succeeds, gives an unrelated error, or modifies files."
