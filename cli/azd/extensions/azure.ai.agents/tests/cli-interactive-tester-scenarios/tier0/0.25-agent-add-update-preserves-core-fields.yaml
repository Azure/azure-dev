# Tier 0: update an Agent service and preserve core fields.
# No Azure authentication, network, or resource creation is allowed.
name: "agent-add-update-preserves-core-fields"
command: "azd ai agent add support-agent --file ./definitions/support.yaml --output json --no-prompt"
cwd: "~/working/azd-agents-t0-agent-add-update-core-{instance}"
tags: ["tier:0", "cmd:add", "parallel-safe"]

env:
  AZURE_ENV_NAME: ""
  AZURE_DEV_COLLECT_TELEMETRY: "no"
  AZD_SKIP_UPDATE_CHECK: "true"
  NO_COLOR: "1"

pre:
  - run: 'rm -rf -- "$HOME/working/azd-agents-t0-agent-add-update-core-{instance}"'
    cwd: "~/working"
    name: "reset the dedicated offline directory"
  - run: >-
      mkdir -p -- "$HOME/working/azd-agents-t0-agent-add-update-core-{instance}/definitions" &&
      cp -- "{fixtures_dir}/agent-add/definitions/support.yaml"
      "$HOME/working/azd-agents-t0-agent-add-update-core-{instance}/definitions/support.yaml" &&
      cp -- "{fixtures_dir}/agent-add/definitions/previous-support.yaml"
      "$HOME/working/azd-agents-t0-agent-add-update-core-{instance}/definitions/previous-support.yaml" &&
      cp -- "{fixtures_dir}/agent-add/projects/update/azure.yaml"
      "$HOME/working/azd-agents-t0-agent-add-update-core-{instance}/azure.yaml"
    cwd: "~/working"
    name: "seed a file-backed Agent and azd-owned fields"

goals:
  - >-
    OFFLINE CONTRACT: No product prompts are allowed. Fail without answering any prompt. Do not
    obtain credentials, install or update extensions, fetch files, contact Azure, create cloud
    resources, or make network calls. Never run init, provision, up, deploy, or other cloud
    commands. Use only the literal add command in this scenario and read-only inspection; do not
    repair fixtures or substitute commands.
  - >-
    Wait for 'azd ai agent add support-agent --file ./definitions/support.yaml --output json
    --no-prompt' to exit with code 0. Confirm stdout contains only one JSON object with exactly
    these fields: string name 'support-agent', string host 'azure.ai.agent', string mutation
    'updated', string ref './definitions/support.yaml', string project 'src/support-agent', and
    string-array dependencies exactly ['ai-project', 'manual-tool']. Human-readable success text
    must not replace or contaminate the JSON, and stderr must not contain a warning.
  - >-
    Compare the updated azure.yaml with
    '{fixtures_dir}/agent-add/projects/update/azure.yaml' as parsed YAML. The root name, ai-project
    and manual-tool services, and all existing support-agent azd-owned fields remain unchanged:
    host, project, uses, apiVersion, condition, dist, docker, env, hooks, image, infra, k8s,
    language, module, remoteBuild, resourceGroup, and resourceName. The unrelated customField
    remains 'keep-me'. The Agent reference changes to './definitions/support.yaml'; no service
    is added or removed. YAML formatting, mapping order, and a schema comment may change.
  - >-
    Inspect the working tree, including hidden files. The only command-created artifact allowed
    beyond the seeded project and definitions is .azure/agent-add.lock and its containing
    directory. No environment config, dotenv files, source files, infrastructure, or deployment
    state may be created.
  - "Take a best-effort screenshot of the JSON result; capture failure must not block later goals."
  - >-
    Report a finding if the command prompts, the JSON shape or mutation differs, any listed
    azd-owned field or unrelated customField changes, a warning is emitted, or any Azure/network/
    resource-creation activity occurs. Do not retry or work around a failed goal.
