# Tier 0: reject multiple Projects despite an explicit selector.
# No Azure authentication, network, or resource creation is allowed.
name: "agent-add-multiple-projects"
command: "azd ai agent add support-agent --file ./definitions/support.yaml --project ai-project --output json --no-prompt"
cwd: "~/working/azd-agents-t0-agent-add-multiple-projects-{instance}"
tags: ["tier:0", "cmd:add", "negative-path", "parallel-safe"]

env:
  AZURE_ENV_NAME: ""
  AZURE_DEV_COLLECT_TELEMETRY: "no"
  AZD_SKIP_UPDATE_CHECK: "true"
  NO_COLOR: "1"

pre:
  - run: 'rm -rf -- "$HOME/working/azd-agents-t0-agent-add-multiple-projects-{instance}"'
    cwd: "~/working"
    name: "reset the dedicated offline directory"
  - run: >-
      mkdir -p -- "$HOME/working/azd-agents-t0-agent-add-multiple-projects-{instance}/definitions" &&
      cp -- "{fixtures_dir}/agent-add/definitions/support.yaml"
      "$HOME/working/azd-agents-t0-agent-add-multiple-projects-{instance}/definitions/support.yaml" &&
      cp -- "{fixtures_dir}/agent-add/projects/multiple-projects/azure.yaml"
      "$HOME/working/azd-agents-t0-agent-add-multiple-projects-{instance}/azure.yaml"
    cwd: "~/working"
    name: "seed a project with two Project services"

goals:
  - >-
    OFFLINE CONTRACT: No product prompts are allowed. Fail without answering any prompt. Do not
    obtain credentials, install or update extensions, fetch files, contact Azure, create cloud
    resources, or make network calls. Never run init, provision, up, deploy, or other cloud
    commands. Use only the literal add command in this scenario and read-only inspection; do not
    repair fixtures or substitute commands.
  - >-
    Wait for 'azd ai agent add support-agent --file ./definitions/support.yaml --project ai-project
    --output json --no-prompt' to exit non-zero. Confirm the error contains
    'multiple azure.ai.project services are declared'. The explicit --project selector must not
    make an ambiguous project valid. No success JSON is emitted, and no product prompt is answered.
  - >-
    Compare the working azure.yaml byte-for-byte with
    '{fixtures_dir}/agent-add/projects/multiple-projects/azure.yaml'. Confirm both Project
    services remain unchanged and no support-agent service is added. No service write occurs;
    the only command-created artifact allowed is .azure/agent-add.lock and its containing
    directory.
  - "Take a best-effort screenshot of the validation error; capture failure must not block later goals."
  - >-
    Report a finding if multiple Project services are accepted, a different error occurs, any
    project service is added or changed, or any prompt, Azure/network activity, or cloud
    resource creation occurs. Do not retry or work around a failed goal.
