# Tier 0 (offline) — A2A request-version help and validation; no successful invocation.
name: "invoke-a2a-version-validation"
command: "azd ai agent invoke --help"
cwd: "~/working/azd-agents-a2a-version-{instance}"
tags: ["tier:0", "cmd:invoke", "negative-path", "parallel-safe"]
env:
  AZURE_DEV_COLLECT_TELEMETRY: "no"
  AZD_CHECK_VERSION: "false"
pre:
  - run: |
      set -eu
      work="$HOME/working/azd-agents-a2a-version-{instance}"
      rm -rf "$work"
      mkdir -p "$work"
      printf '%s\n' '{"jsonrpc":"2.0","id":"hello-1","method":"message/send","params":{"message":{"kind":"message","messageId":"hello-message-1","role":"user","parts":[{"kind":"text","text":"Hello!"}]},"configuration":{"acceptedOutputModes":["text/plain"],"blocking":true}}}' > "$work/a2a-request.json"
    cwd: "~/working"
    name: "seed a complete public A2A 0.3 JSON-RPC request in an isolated directory"

goals:
  - "Confirm invoke help exits with code 0 and advertises --a2a-version with supported values 0.3 and 1.0. Confirm it explains that azd composes the body and A2A-Version header for plain messages, infers public wire version 1.0 from an A2A hosted implementation declaration of 1.0.0 (the currently supported Foundry hosted definition version), and otherwise uses 1.0 as a translation convenience default (including standalone --agent-endpoint without a local definition). Public agentEndpoint.protocols enablement must not be described as an implementation declaration. Clarify that 1.0 is the MAJOR.MINOR wire selector and that routing normalization does not prove other hosted definition versions are accepted. Confirm explicit overrides require compatibility, a 0.3-only implementation is unsupported, a separate Responses implementation permits translation selection subject to service support, and future versions are not assumed compatible. A2A file input always requires an explicit --a2a-version, even with A2A hosted agent YAML. A2A passthrough requires endpoint enablement; fresh hosted endpoints default to Responses only."
  - "Confirm help distinguishes public A2A versions from Foundry API and deployed agent versions (--version). Confirm explicit -p a2a + --a2a-version examples precede the convenience-default example, and the A2A file-input example includes an explicit version. Confirm file bytes are unchanged and the caller must match the body and header without version inference. Confirm --local is described as a CLI limitation, not a protocol restriction."
  - "Confirm help does not promise A2A session reuse or in-memory state: Responses and Invocations persist returned IDs, while A2A hosted agent affinity is service-controlled. Request-body context IDs do not guarantee the same process, and GetTask may return TaskNotFound with a process-local task store without affinity. Do not infer full session/task lifecycle support from this offline scenario."
  - "Confirm help documents the previous 0.3 default and --a2a-version 0.3 migration, and directs streaming requests to --output raw. Do not execute streaming requests in this offline scenario."
  - 'Run azd ai agent invoke --protocol a2a --input-file a2a-request.json. Confirm it exits non-zero with a validation error explaining that --input-file with A2A requires an explicit --a2a-version; the 1.0 plain-message default must not silently apply to file input.'
  - 'Run azd ai agent invoke --protocol a2a --version 3 --input-file a2a-request.json. Confirm it exits non-zero with the same explicit --a2a-version requirement; --version must not satisfy it.'
  - 'Run azd ai agent invoke --protocol a2a --a2a-version 2.0 "Hello!". Confirm it exits non-zero with an unsupported-version validation error naming --a2a-version and listing 0.3 and 1.0 as supported values.'
  - 'Run azd ai agent invoke --protocol a2a --a2a-version= "Hello!". Confirm it exits non-zero with a validation error for the empty --a2a-version value, rather than silently selecting the default.'
  - 'Run azd ai agent invoke --protocol responses --a2a-version 1.0 "Hello!". Confirm it exits non-zero with a validation error explaining that --a2a-version is supported only with the a2a protocol.'
  - 'Run azd ai agent invoke --protocol invocations --a2a-version 0.3 "Hello!". Confirm it exits non-zero with the same A2A-only validation error.'
  - "Confirm every invalid command is rejected before authentication, an agent picker, network activity, or agent execution. No product prompts are allowed. Do not run a valid invocation, init, provision, or deploy in this offline scenario."
  - "Take a screenshot of the help and validation output on a best-effort basis."
  - "Report a finding if help contradicts the version contract, an invalid combination is accepted, validation reports a different error, or any command prompts or begins agent execution."
