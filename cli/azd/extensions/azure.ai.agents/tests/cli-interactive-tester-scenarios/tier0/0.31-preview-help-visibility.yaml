# Tier 0: read-only preview help visibility; no auth or Azure cost.
name: "preview-help-visibility"
command: "azd ai agent init --help"
cwd: "/tmp"
tags: ["tier:0", "cmd:init", "cmd:invoke", "cmd:help", "parallel-safe"]
goals:
  - "Confirm the command exits with code 0 without a picker, login prompt, or project mutation."
  - "With no preview opt-ins, confirm init help does not list --voice or --harness, the --kind text names only 'hosted' and 'prompt', and there is no Voice Agents section or prompt-voice example."
  - "With no preview opt-ins, confirm no help text names voice, prompt-voice, harness, or long-running. Check the root, init, add, delete, show, and endpoint show help, including the --acr-connection, --instructions, and --model usages."
  - "Run 'azd ai agent invoke --help'. Confirm it does not list --long-running or --no-wait and has no Long-running Invocations or Voice Agents section."
  - "Run 'azd ai agent --help'. Confirm the command list does not include invocations."
  - "Run 'azd ai agent invocations show --help'. Confirm it still exits with code 0 and shows the command help."
  - "Run 'AZD_FOUNDRY_EXT_ENABLE_AGENTS_VOICE=true azd ai agent init --help'. Confirm --voice, the prompt-voice --kind option, the Voice Agents section, the prompt-voice examples, and the voice notes in the --acr-connection and --model usages are shown."
  - "Run 'AZD_FOUNDRY_EXT_ENABLE_AGENTS_LONG_RUNNING=true azd ai agent invoke --help'. Confirm --long-running, --no-wait, and the Long-running Invocations section are shown."
  - "Run 'azd ai agent init --kind prompt-voice --agent-name voice-check --no-prompt'. Confirm it exits non-zero naming agents.voice and does not create files."
  - "Take a screenshot of the default and enabled help output."
  - "Report a finding if a disabled preview is shown, an enabled preview is missing, a hidden command cannot run, or any command prompts or mutates a project."
