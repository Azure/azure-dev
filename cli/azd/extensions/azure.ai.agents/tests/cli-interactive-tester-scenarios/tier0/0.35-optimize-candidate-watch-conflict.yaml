# Tier 0 (offline) - candidate inspection and job watching must not be combined.
name: "optimize-candidate-watch-conflict"
command: "azd ai agent optimize status not-submitted --candidate not-created --watch --no-prompt"
cwd: "/tmp"
tags: ["tier:0", "cmd:optimize", "negative-path", "parallel-safe"]
goals:
  - "Confirm the command exits non-zero with a validation error stating that --candidate cannot be combined with --watch."
  - "Confirm the error suggests inspecting a candidate or watching the job."
  - "Confirm no authentication, agent picker, endpoint request, or optimization submission starts."
  - "Confirm no project files or environment values are changed."
  - "Take a screenshot of the validation output; screenshot capture failure is only an observation."
  - "Report a finding if either flag is silently ignored, an endpoint is contacted, or the error does not identify both conflicting flags."
