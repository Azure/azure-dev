# Tier 1 (auth, scaffold only) — interactive container deploy mode.
#
# Requires Azure login (see README "Authentication"). Does NOT run `azd provision`;
# no cost incurred.
# Targets the --deploy-mode container path, which builds/packages a container
# image. Container mode may prompt for a startup command (Dockerfile CMD) but
# should NOT prompt for entry-point + runtime (those are code-deploy concerns).
# Complements 10-init-deploy-mode-code.yaml.
name: "init-deploy-mode-container"
command: "azd ai agent init --deploy-mode container"
cwd: "~/working/azd-agents-t1-container-deploy-{instance}"
tags: ["tier:1", "cmd:init", "parallel-safe"]
produces: "~/working/azd-agents-t1-container-deploy-{instance}"

env:
  AZD_DISABLE_AGENT_DETECT: "1"

# Seed a committed Python fixture so container-deploy has real source to package.
pre:
  - run: "rm -rf ~/working/azd-agents-t1-container-deploy-{instance}"
    cwd: "~/working"
    name: "reset working dir"
  - run: "mkdir -p ~/working/azd-agents-t1-container-deploy-{instance} && cp -r \"{fixtures_dir}/from-code/.\" ~/working/azd-agents-t1-container-deploy-{instance}/"
    cwd: "~/working"
    name: "seed from-code agent fixture (app.py + requirements.txt)"
  - run: "printf 'FROM python:3.13-slim\\nWORKDIR /app\\nCOPY . .\\nRUN pip install --no-cache-dir -r requirements.txt\\nCMD [\"python\", \"app.py\"]\\n' > ~/working/azd-agents-t1-container-deploy-{instance}/Dockerfile"
    cwd: "~/working"
    name: "seed deterministic Dockerfile"

goals:
  - "RESOURCE NAMING: whenever you are prompted to NAME a new Azure resource you are creating (Foundry account, azd environment, agent, model deployment, or resource group), give it a name prefixed with '{prefix}-' and suffixed with this run's instance id '-{instance}' so concurrent instances don't collide on resource names. The Foundry project is an exception: name it exactly '{foundry_project_name}', the orchestrator-derived value that preserves the run-unique instance within the 32-character limit. Some fields lowercase the value and replace invalid characters with hyphens; that normalization is expected. If a name prompt comes pre-filled with a default value, CLEAR it first (select-all then delete, or backspaces) before typing so your name replaces the default instead of appending to it."
  - "When prompted for the AGENT NAME, set it to EXACTLY '{prefix}-t1-container-{instance}' (clear any pre-filled default first, then type it). The from-code flow updates the current project directory; it does not create an agent-name subdirectory."
  - "At the first 'How do you want to initialize your agent?' prompt, select 'Use the code in the current directory'."
  - "Wait for the tool to inspect the current directory's code with container-deploy mode selected. The supplied Dockerfile already declares CMD, so initialization must preserve and use it rather than generating or replacing the file."
  - "Confirm initialization does NOT show the code-deploy-only 'Select the runtime for your agent' or 'Enter the file path for the entry point of the agent' prompts."
  - "At the 'Which protocols does your agent support?' prompt, verify 'responses' is selected by default and every other protocol is unselected. Leave that selection unchanged and continue."
  - "If asked to select an Azure AI Foundry project, choose to create a new one and name it exactly '{foundry_project_name}'; clear any default first."
  - "A 'Select a tenant' prompt may not appear when the signed-in user has access to only one tenant. If it appears, select the tenant provided with this scenario run. If no tenant was provided, report a failure and do not answer the prompt."
  - "If asked to select a subscription, search for and select the '{subscription}' subscription."
  - "If asked for a location/region, search for and select '{region}'."
  - "If asked to select a model, choose '{model}' and accept the defaults for model version, SKU, and capacity."
  - "Wait for initialization to complete — look for 'Next:' or a success message."
  - "Verify Dockerfile is preserved byte-for-byte with these lines in order: 'FROM python:3.13-slim', 'WORKDIR /app', 'COPY . .', 'RUN pip install --no-cache-dir -r requirements.txt', and 'CMD [\"python\", \"app.py\"]'."
  - "Verify the scaffold: confirm azure.yaml in the current working directory reflects container-deploy mode — the azure.ai.agent service entry must contain container build configuration under docker (including remoteBuild: true for this non-network-injected source build) and must not contain codeConfiguration."
  - "Take a screenshot of the completed init output."
  - "STOP here — do NOT run 'azd provision'. Report a finding if container mode changes the supplied Dockerfile, shows code-deploy runtime or entry-point prompts, writes codeConfiguration, fails to persist docker build configuration, or attempts legacy standalone agent manifest discovery."
