# Tier 1 (auth, local init only): temporary generated GitHub Copilot harness region guard.
# Requires Azure login and externally prepared, readable Foundry projects in both
# an allowed and a disallowed region; the latter must have a usable model deployment.
# Configure {region} to an allowed region and {model} to a catalog model unavailable
# there but available with quota in a disallowed recovery region. Missing fixtures
# fail setup, not pass with skipped checks. No adoption or cloud resource creation.
name: "init-harness-region-restrictions"
command: "azd ai agent init --kind prompt --harness github_copilot_preview --agent-name {prefix}-picker-{instance} --description 'Region guard probe' --instructions 'Be helpful.' --rai-policy none"
cwd: "~/working/azd-agents-harness-regions-{instance}"
tags: ["tier:1", "cmd:init", "parallel-safe", "picker", "negative-path", "manual-seed"]

env:
  AZD_DISABLE_AGENT_DETECT: "1"
  AZURE_ENV_NAME: ""
  AZURE_LOCATION: ""
  AZURE_SUBSCRIPTION_ID: ""

pre:
  - run: "rm -rf ~/working/azd-agents-harness-regions-{instance}"
    cwd: "~/working"
    name: "reset working dir"

goals:
  - >-
    Before answering product prompts, use read-only Azure queries to identify the seeded projects in
    '{subscription}' and verify their locations and the recovery model prerequisites. Record the disallowed
    project's full resource ID as shell variable $unsupported_project_id and its usable deployment name as
    $existing_deployment for subsequent commands. Allowed region IDs are exactly japaneast,
    swedencentral, uksouth, australiaeast, westeurope, germanywestcentral, canadacentral, westus2.
    Do not create fixtures during this run.
  - >-
    RESOURCE NAMING: if asked for an azd environment name, clear any default and use '{prefix}-picker-{instance}'
    for the initial command, then '{prefix}-id-{instance}', '{prefix}-plain-{instance}', or
    '{prefix}-recovery-{instance}' for the corresponding checks below. If asked for a new Foundry project name,
    clear any default and enter '{foundry_project_name}'. No agent-name, description, instructions, init-method,
    language, deploy-mode, or Responsible AI policy prompt should appear because flags supply those inputs.
  - >-
    For interactive checks, if 'Select a tenant' appears, select the tenant provided with this run; fail without
    answering if none was provided. If asked for a subscription, select '{subscription}'. For the initial command,
    at 'Select a Foundry
    project to host your agent and model', select 'Use an existing Foundry project'. Confirm the project picker
    includes the seeded allowed-region project and excludes every disallowed-region project, including the seeded
    disallowed project. Take a screenshot, then cancel before selecting a project. No agent service should be written.
  - >-
    From the scenario root, create and enter a fresh 'explicit-id' subdirectory. Run
    `azd ai agent init --kind prompt --harness github_copilot_preview --agent-name {prefix}-id-{instance}
    --description 'Region guard probe' --instructions 'Be helpful.' --rai-policy none
    --project-id "$unsupported_project_id" --model-deployment "$existing_deployment" --no-prompt`.
    Expect non-zero exit with an error identifying the unsupported project region and the GitHub Copilot harness,
    and guidance to use a supported region. No product prompts, successful init summary, or harness agent service
    may appear; starter files or local environment state alone are not a completed agent scaffold.
  - >-
    From the scenario root, create and enter a fresh 'plain' subdirectory. Run
    `azd ai agent init --kind prompt --agent-name {prefix}-plain-{instance}
    --description 'Region guard probe' --instructions 'Be helpful.' --rai-policy none
    --project-id "$unsupported_project_id" --model-deployment "$existing_deployment" --no-prompt`.
    It must complete successfully without product
    prompts or the harness-region error. Verify the generated azure.yaml defines a kind: prompt agent with no
    harness block, reuses the disallowed-region project and existing deployment, and preserves that project's
    region in the local environment. Do not provision or deploy it.
  - >-
    From the scenario root, create and enter a fresh 'recovery' subdirectory. Run
    `azd ai agent init --kind prompt --harness github_copilot_preview --agent-name {prefix}-recovery-{instance}
    --description 'Region guard probe' --instructions 'Be helpful.' --rai-policy none --model {model}`.
    At 'Select a Foundry project to host your agent and model', choose 'Create a new Foundry project'.
    The initial location picker must offer only the eight allowed region IDs (display labels may be friendly names)
    and must exclude the seeded disallowed region. Take a screenshot and select '{region}'.
  - >-
    At "Model '{model}' is selected.", choose "Use '{model}'". Expect the model-unavailable recovery flow.
    At 'What would you like to do?', choose 'Choose a different location for {model}'. At 'Select a location for
    model '{model}'', select the prepared disallowed recovery region with quota. This deliberately exercises the
    shared model recovery path, not a requirement to restrict its picker. If that region is not offered, fail the
    fixture/coverage check rather than skipping it or claiming the final-region guard was exercised.
  - >-
    If model version, SKU, or capacity is requested after recovery, accept the offered defaults. If asked for a
    model deployment name, clear its default and enter '{prefix}-model-{instance}'. Init must then exit non-zero
    with an error identifying the final disallowed region and the GitHub Copilot harness, with supported-region
    guidance, before writing the harness agent service or printing a successful init summary. A region change
    during recovery must not bypass the guard. No later project-authoring prompt is expected.
  - >-
    Take screenshots of the region errors and plain-prompt completion. STOP: do not run azd up, provision, deploy,
    or down. Report a finding for any unfiltered picker, accepted unsupported harness target, plain-prompt
    regression, unexpected prompt, or missing final-region rejection. This scenario covers generated init only;
    do not adopt or modify an existing azure.yaml or agent definition.
