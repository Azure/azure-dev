# Tier 1: authenticated adoption picker; external seed, no cloud writes.
name: "init-adopt-existing-model"
command: 'azd ai agent init -t "{fixtures_dir}/adopt-model-choice/azure.yaml" --src . --agent-name {prefix}-reuse-{instance} --environment {prefix}-reuse-{instance}'
cwd: "~/working/azd-agents-adopt-reuse-{instance}"
tags: ["tier:1", "cmd:init", "parallel-safe", "picker", "manual-seed"]
env:
  AZD_DISABLE_AGENT_DETECT: "1"
  AZURE_ENV_NAME: ""
pre:
  - run: "test -s ~/working/azd-agents-adoption-seed-{run_id}.json"
    cwd: "~/working"
    name: "require externally prepared adoption seed"
  - run: "rm -rf ~/working/azd-agents-adopt-reuse-{instance}"
    cwd: "~/working"
    name: "reset isolated adoption working dir"
goals:
  - >-
    Read ~/working/azd-agents-adoption-seed-{run_id}.json and verify with read-only Azure queries
    that project_id identifies a readable Foundry project in '{subscription}', existing_deployment
    exists on its account, and its model differs from gpt-4o. Record the project name and deployment
    name for picker selection. Missing or invalid seed is a failure, not a skipped check.
    Do not create or modify the external seed or any Azure resource.
  - >-
    At 'Select a Foundry project to host your agent and any models or tools it uses.',
    choose 'Use an existing Foundry project'. If 'Select a tenant' appears, select the tenant
    provided with this run; fail without answering if none was provided. If asked for a subscription,
    select '{subscription}'. In the Foundry project picker select the verified seeded project.
    No agent-name, environment-name, model-name, description, instructions, or new-project prompt
    should appear because the template and flags supply those inputs.
  - >-
    At 'How would you like to proceed with deployment "template-chat" (model "gpt-4o")?',
    select 'Choose a different model'. At 'How would you like to choose a model?', select
    'Use existing deployment' with the verified existing_deployment name. No catalog or
    model-deployment configuration prompt should appear.
  - >-
    Confirm init exits successfully with adoption guidance and 'Next:'. Inspect the active
    environment without printing its whole contents: AI_PROJECT_DEPLOYMENTS must decode to [],
    AI_PROJECT_DEPLOYMENT_BINDINGS must map template-chat to existing_deployment, and
    AZURE_AI_MODEL_DEPLOYMENT_NAME must equal existing_deployment. The portable azure.yaml must
    retain template-chat with model gpt-4o and the prompt agent's model reference to template-chat.
  - "Take a screenshot of the completed init output."
  - >-
    STOP without provision, deploy, up, or invoke. Report a finding for an unexpected prompt,
    a failed init, lost binding, changed portable deployment, or any cloud mutation.
