# Tier 2 (cloud E2E) — SETUP: deploy the shared agent used by scenarios 2.01-2.18.
#
# ⚠️ Incurs Azure cost. Run this FIRST. `init` runs in ~/working/azd-agents-shared
# and scaffolds the project into a subdirectory named after the agent, so the
# deployed project lives in ~/working/azd-agents-shared/{shared_agent_name}
# (where {shared_agent_name} = {prefix}-{shared_agent_suffix}-{run_id}, e.g.
# "alice-basic-responses-0714103842-a1b2c3") and is reused by the targeted scenarios.
# The agent name MUST be exactly that value so the subdirectory path is
# deterministic and the reuse scenarios can find it. Run
# 2.99-teardown-down.yaml LAST to clean up. All `{name}` placeholders come
# from the merged profile (`profile.yaml` + `profile.local.yaml`) plus the
# orchestrator-derived `shared_agent_name`.
#
# NOTE: The Python "Basic Responses" template auto-selects CODE deploy mode
# (no deploy-mode prompt appears). The resulting agent is code-based, which
# means `code download` will succeed against it.
name: "setup-deploy-shared-agent"
command: "azd ai agent init --agent-name {shared_agent_name}"
cwd: "~/working/azd-agents-shared"
tags: ["tier:2", "cmd:init", "cmd:provision", "cmd:deploy", "serial-only"]

env:
  AZD_DISABLE_AGENT_DETECT: "1"

# Idempotent setup: if this run's project path already contains a project, tear
# down its Azure resources FIRST, then clear only that project directory for a
# fresh deploy. A failed teardown aborts setup and preserves the project state
# for recovery. Other run directories under azd-agents-shared are left intact.
# Re-using a clean path also avoids the resource-name hash collision in issue
# #8360.
pre:
  - run: |
      PROJECT=~/working/azd-agents-shared/{shared_agent_name}
      if [ -f "$PROJECT/azure.yaml" ]; then
        (cd "$PROJECT" && azd down --force --purge) || {
          echo "ERROR: Could not tear down the existing project. State retained at $PROJECT."
          exit 1
        }
      fi
      rm -rf -- "$PROJECT"
    cwd: "~/working/azd-agents-shared"
    name: "tear down and clear the current run project"
    timeout: 900

goals:
  - "RESOURCE NAMING: whenever you are prompted to NAME a new Azure resource you are creating (Foundry project/account, azd environment, agent, model deployment, or resource group), give it a name that includes the exact run-unique suffix '{run_id}' (for example, '{shared_agent_name}'). A '{prefix}-' prefix alone is not sufficient because concurrent sweeps can share it. Some fields lowercase the value and replace invalid characters with hyphens; that normalization is expected. If a name prompt comes pre-filled with a default value, CLEAR it first (select-all then delete, or backspaces) before typing so your name replaces the default instead of appending to it."
  - "When asked how to initialize, select 'Start new from a template'."
  - "Select Python as the language."
  - "Select the 'Basic Responses' template from the list."
  - "No agent-name prompt should appear because --agent-name was supplied explicitly. The resulting agent identity and project subdirectory must both be exactly '{shared_agent_name}'. Report a finding if the wizard asks for the agent name."
  - "If asked to select an Azure AI Foundry project, create a new one and give it a name containing the exact '{run_id}' suffix."
  - "A 'Select a tenant' prompt may not appear when the signed-in user has access to only one tenant. If it appears, select the tenant provided with this scenario run. If no tenant was provided, report a failure and do not answer the prompt."
  - "If asked to select a subscription, search for and select the '{subscription}' subscription."
  - "If asked for a location/region, search for and select '{region}'."
  - "When asked to select a model, choose '{model}'."
  - "Accept the defaults for model version, SKU, capacity. If prompted for a model deployment name, give it a name containing the exact '{run_id}' suffix."
  - "Wait for initialization to complete — look for 'Next:' or a success message."
  - "Change directory into the new '{shared_agent_name}' subdirectory (run 'cd {shared_agent_name}') — init scaffolds the project into a subdirectory named after the agent, so azure.yaml lives there, not in the current directory."
  - "Run 'azd provision' (from inside the '{shared_agent_name}' subdirectory) and wait for it to succeed. This provisions the Azure infrastructure (Foundry project/account, model deployment, etc.) but does NOT yet deploy the agent."
  - "After provision succeeds, run 'azd deploy' (from the same subdirectory) and wait for it to succeed. This deploys the agent to the provisioned infrastructure — it is a required, separate step from provision before the agent can be shown or invoked."
  - "After deploy, run 'azd ai agent show' and note the agent name and endpoint URL — record these for the targeted scenarios."
  - "Take a screenshot of the successful provision, deploy, and 'show' output."
  - "Report a finding if init, provision, or deploy fails, hangs, or produces a confusing error. Do NOT run 'azd down' here — teardown is a separate scenario."
