# Tier 2 (cloud E2E) — `invoke` SESSION vs CONVERSATION memory semantics.
#
# For the responses-protocol agent (Basic Responses), multi-turn memory is bound
# to the conversation. `--new-session` starts a fresh session and conversation so
# the new session does not inherit memory from the previous conversation.
#
# Precondition: 2.00-setup-deploy-shared-agent.yaml has been run successfully.
name: "invoke-session-vs-conversation"
command: "bash"
cwd: "~/working/azd-agents-shared/{shared_agent_name}"
tags: ["tier:2", "cmd:invoke", "serial-only"]
requires: "tier2/2.00-setup-deploy-shared-agent.yaml"

# Precondition guard: warn (do not hard-fail) if the shared agent is not deployed.
pre:
  - run: "test -f ~/working/azd-agents-shared/{shared_agent_name}/azure.yaml && echo 'OK: shared agent project found' || echo 'PRECONDITION FAILED: shared agent not found - run 2.00-setup-deploy-shared-agent.yaml first'"
    cwd: "~/working/azd-agents-shared/{shared_agent_name}"
    name: "assert shared agent is deployed"
    continue_on_error: true

goals:
  - "Run: azd ai agent invoke \"My name is Quinn. Remember it.\" and wait for a response."
  - "Run: azd ai agent invoke \"What is my name?\" and confirm the agent recalls 'Quinn' (the persisted session and conversation were reused, so multi-turn memory works)."
  - "Using the conversation ID from the previous invoke, run: azd ai agent invoke --new-session --conversation-id <existing-id> \"What is my name?\". Confirm it fails with a flag-conflict error and guidance to remove --conversation-id, without invoking the agent. Repeat with --local and confirm the same validation error."
  - "Run: azd ai agent invoke --new-session \"What is my name?\" and confirm the agent does NOT recall 'Quinn'. A new session also starts a new conversation, so previous multi-turn memory must be cleared."
  - "Run: azd ai agent invoke \"My name is Riley. Remember it.\" and wait for a response, then run: azd ai agent invoke --new-conversation \"What is my name?\" and confirm the agent does NOT recall 'Riley'. --new-conversation resets memory without requiring --new-session."
  - "Take a screenshot after each invoke."
  - "Report a finding if: the first two invokes fail to establish/recall memory; OR --new-session still recalls 'Quinn'; OR --new-conversation still recalls 'Riley'."
