# Tier 2 (cloud E2E) — `doctor` against a fully provisioned project (checks pass).
#
# Precondition: 2.00-setup-deploy-shared-agent.yaml has been run successfully.
name: "doctor-provisioned-all-pass"
command: "azd ai agent doctor"
cwd: "~/working/azd-agents-shared/{shared_agent_name}"
tags: ["tier:2", "cmd:doctor", "serial-only"]
requires: "tier2/2.00-setup-deploy-shared-agent.yaml"

# Precondition guard: warn (do not hard-fail) if the shared agent is not deployed.
pre:
  - run: "test -f ~/working/azd-agents-shared/{shared_agent_name}/azure.yaml && echo 'OK: shared agent project found' || echo 'PRECONDITION FAILED: shared agent not found - run 2.00-setup-deploy-shared-agent.yaml first'"
    cwd: "~/working/azd-agents-shared/{shared_agent_name}"
    name: "assert shared agent is deployed"
    continue_on_error: true

goals:
  - "Run doctor against the provisioned project. Wait for the full check suite (local + remote) to render."
  - "Confirm the local checks pass (project, azure.yaml, agent service config)."
  - "Confirm the remote checks pass (deployed agent reachable / active)."
  - "Confirm 'Project storage permissions' appears in the Remote section. If the project has no capability host, no Storage bindings, or only bound connections using account-key authentication, confirm this check is skipped with an explanatory reason. Unbound project or shared Storage connections must not affect the result."
  - "For bound project-identity Storage connections, confirm the check passes when sufficient direct Blob data permissions are verified, including equivalent built-in roles and assignments inherited from ancestor scopes. If only container-scoped access is found, group access remains unverified, or permission metadata cannot be read, confirm a warning instead of a missing-permission failure or a recommendation to expand access. The check must not create resources, assign roles, or print connection credentials."
  - "Confirm doctor suggests a sensible next command (e.g. invoke or run) and exits 0 (at least one check passed, none failed)."
  - "KNOWN-ACCEPTABLE WARNING: a WARNING about agent identity / role assignments is EXPECTED in this test subscription (its ABAC conditional role-assignment policy blocks some role reads) and must NOT be treated as a failure. Only an actual FAILED check (not a warning) is a finding."
  - "Take a screenshot of the doctor report."
  - "Report a finding if a check FAILS (red/error), or is skipped unexpectedly, for a healthy provisioned project, or if the suggested next step is wrong. The project storage skip described above is expected when not applicable. Do NOT report the known identity/role-assignment warning described above."
