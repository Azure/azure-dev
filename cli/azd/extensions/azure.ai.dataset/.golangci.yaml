version: "2"

linters:
  default: none
  enable:
    - gosec
    - lll
    - unused
    - errorlint
  settings:
    lll:
      line-length: 125
      tab-width: 4
  exclusions:
    rules:
      # G204 cannot apply to the live harness building and running the
      # extension binary at a path it computed itself. No production code
      # launches a subprocess, so nothing real is silenced here.
      - path: _test\.go$
        text: G204
        linters:
          - gosec

formatters:
  enable:
    - gofmt
