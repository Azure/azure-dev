# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/refs/heads/main/cli/azd/extensions/extension.schema.json
capabilities:
  - custom-commands
  - metadata
description: Manage versioned RLE resources from a host-agnostic rle.toml manifest. Set AZD_AI_RLE_ENABLE_ALL=true to show experimental training commands. (Preview)
displayName: RLE (Preview)
id: azure.ai.rle
language: go
namespace: ai.rle
tags:
  - ai
  - rle
usage: azd ai rle <command> [options]
version: 0.8.33-preview
examples:
  - name: publish
    description: Build, push, and publish the RLE release declared in rle.toml.
    usage: azd ai rle publish
  - name: run
    description: "Build and run the local RLE environment container (Gym: OpenEnv only)."
    usage: azd ai rle run
  - name: rollout
    description: Execute one rollout of the environment version declared in rle.toml. Train mode uses Loom; eval mode uses a Foundry deployment unless --loom is set. The model defaults to model.name in rle.toml.
    usage: azd ai rle rollout --task-file task.json
  - name: models
    description: List supported RLE model identifiers and renderers.
    usage: azd ai rle models
  - name: list
    description: List RLE environments in a Foundry project.
    usage: azd ai rle list
  - name: show
    description: Show the details and version history for an RLE environment.
    usage: azd ai rle show [environment-name]
