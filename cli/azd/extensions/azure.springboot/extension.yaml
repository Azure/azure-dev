# yaml-language-server: $schema=../extension.schema.json
id: azure.springboot
namespace: spring
displayName: Azure Spring Boot
description: Prepares Spring Boot services for deployment to Azure Container Apps.
usage: azd spring <command> [options]
version: 0.1.0
requiredAzdVersion: ">=1.37.2"
language: go
capabilities:
  - framework-service-provider
  - lifecycle-events
  - service-target-provider
  - metadata
providers:
  - name: springbootapp
    type: service-target
    description: Packages and deploys Spring Boot applications to Azure Container Apps.
