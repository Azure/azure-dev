# Managed-identity MVC fixture; requires the matching unpublished local extension.
# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: spring-petclinic
requiredVersions:
  azd: ">=1.37.2"
  extensions:
    azure.springboot: ">=0.1.0"
infra:
  provider: bicep
  path: infra
  module: main
services:
  petclinic:
    project: .
    language: java
    host: springbootapp
    module: petclinic
# The app creates/seeds its own objects at startup; Hibernate DDL remains none.
