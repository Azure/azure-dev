# PostgreSQL runtime configuration. The application creates and seeds its own
# objects at startup; Hibernate does not manage DDL.
database=postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost/petclinic}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:petclinic}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
