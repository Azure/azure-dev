spring.profiles.active=spring-data-jpa

server.port=9966
server.servlet.context-path=/petclinic/

# PostgreSQL endpoint and application role.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/petclinic}
spring.datasource.username=petclinic_app

# Authenticate with managed identity instead of a database password.
spring.datasource.azure.passwordless-enabled=true
spring.datasource.hikari.data-source-properties[authenticationPluginClassName]=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
spring.datasource.hikari.data-source-properties[azure.managedIdentityEnabled]=true

# Verify the server certificate and hostname.
spring.datasource.hikari.data-source-properties[sslmode]=verify-full
spring.datasource.hikari.data-source-properties[sslrootcert]=/etc/ssl/certs/ca-certificates.crt

# Preserve upstream application-owned schema and seed initialization.
spring.sql.init.platform=postgres
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:db/${spring.sql.init.platform}/schema.sql
spring.sql.init.data-locations=classpath*:db/${spring.sql.init.platform}/data.sql

spring.messages.basename=messages/messages
spring.jpa.open-in-view=false

logging.level.org.springframework=INFO
petclinic.security.enable=false
