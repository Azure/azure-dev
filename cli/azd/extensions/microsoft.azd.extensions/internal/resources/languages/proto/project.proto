syntax = "proto3";

package azdext;

option go_package = "github.com/azure/azure-dev/cli/azd/pkg/azdext;azdext";
option csharp_namespace = "Microsoft.Azd";

import "models.proto";

// ProjectService defines methods for managing projects and their configurations.
service ProjectService {
  // Gets the current flat or infra.layers project.
  // Top-level layers projects must use ListLayers or GetLayer.
  rpc Get(EmptyRequest) returns (GetProjectResponse);

  // AddService adds a new service to the project.
  rpc AddService(AddServiceRequest) returns (EmptyResponse);

  // SetLayer creates or fully replaces a persisted top-level project layer.
  rpc SetLayer(SetLayerRequest) returns (LayerResponse);

  // GetLayer gets a persisted top-level project layer by name.
  rpc GetLayer(GetLayerRequest) returns (LayerResponse);

  // ListLayers lists all persisted top-level project layers.
  rpc ListLayers(EmptyRequest) returns (ListLayersResponse);

  // RemoveLayer removes a project layer and its contents.
  rpc RemoveLayer(RemoveLayerRequest) returns (RemoveLayerResponse);
}

// GetProjectResponse message definition
message GetProjectResponse {
  ProjectConfig project = 1;
}

// AddServiceRequest message definition
message AddServiceRequest {
  ServiceConfig service = 1;
}

// Layer contains the complete infrastructure and service configuration for a project layer.
message Layer {
  // Name identifies the layer. It cannot be empty.
  string name = 1;
  // Infra lists the provisioning entries owned by the layer.
  repeated InfraOptions infra = 2;
  // Services lists the service definitions owned by the layer, keyed by service name.
  map<string, ServiceConfig> services = 3;
}

message SetLayerRequest {
  Layer layer = 1;
}

message GetLayerRequest {
  // Name identifies a persisted top-level layer. It cannot be empty.
  string name = 1;
  // Envsubst expands environment variable references in expandable service values when true.
  bool envsubst = 2;
}

message LayerResponse {
  Layer layer = 1;
}

message ListLayersResponse {
  repeated Layer layers = 1;
}

message RemoveLayerRequest {
  string name = 1;
}

message RemoveLayerResponse {
  repeated string removed_services = 1;
}
