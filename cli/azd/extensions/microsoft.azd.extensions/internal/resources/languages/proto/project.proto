syntax = "proto3";

package azdext;

option go_package = "github.com/azure/azure-dev/cli/azd/pkg/azdext;azdext";
option csharp_namespace = "Microsoft.Azd";

import "models.proto";
import "google/protobuf/struct.proto";

// ProjectService defines methods for managing projects and their configurations.
service ProjectService {
  // Gets the current project.
  rpc Get(EmptyRequest) returns (GetProjectResponse);

  // AddService adds a new service to the project.
  rpc AddService(AddServiceRequest) returns (EmptyResponse);

  // Creates or patches a service under one process-local mutation lock.
  rpc PatchServiceConfig(PatchServiceConfigRequest) returns (EmptyResponse);
}

// GetProjectResponse message definition
message GetProjectResponse {
  ProjectConfig project = 1;
}

// AddServiceRequest message definition
message AddServiceRequest {
  ServiceConfig service = 1;
}

message PatchServiceConfigRequest {
  string service_name = 1;
  string required_host = 2;
  bool create_if_missing = 3;
  map<string, google.protobuf.Value> set_values = 4;
  repeated string unset_paths = 5;
  StringListValue expected_uses = 6;
}

message StringListValue {
  repeated string values = 1;
}