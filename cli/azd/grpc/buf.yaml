version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # These naming shapes predate versioning and are part of the public contract.
  # Renaming them in this one-time package move would add an unrelated source break.
  except:
    - ENUM_ZERO_VALUE_SUFFIX
    - FIELD_LOWER_SNAKE_CASE
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
