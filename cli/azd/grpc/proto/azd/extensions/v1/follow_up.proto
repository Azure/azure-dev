syntax = "proto3";

package azd.extensions.v1;

option go_package = "github.com/azure/azure-dev/cli/azd/pkg/azdext/contracts/v1;v1";

// FollowUpService accepts command follow-up contributions from extensions.
service FollowUpService {
  // Sets or clears the contribution for a project handler invocation.
  rpc SetFollowUp(SetFollowUpRequest) returns (SetFollowUpResponse);
}

message SetFollowUpRequest {
  // Opaque identifier supplied with the project handler invocation.
  string invocation_id = 1;
  // Empty text explicitly clears the contribution.
  string text = 2;
}

message SetFollowUpResponse {}
