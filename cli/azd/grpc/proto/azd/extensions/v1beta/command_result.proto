syntax = "proto3";

package azd.extensions.v1beta;

option go_package = "github.com/azure/azure-dev/cli/azd/pkg/azdext/contracts/v1beta;v1beta";
// CommandResultService accepts command-result contributions.
service CommandResultService {
  // Sets or clears the follow-up contribution for a project
  // handler invocation.
  rpc SetFollowUp(SetFollowUpRequest) returns (SetFollowUpResponse);
}

message SetFollowUpRequest {
  // Opaque identifier supplied with the project handler invocation.
  string invocation_id = 1;
  // Empty text explicitly clears the contribution.
  string text = 2;
}

message SetFollowUpResponse {}
