syntax = "proto3";

package azd.extensions.v1beta;

option go_package = "github.com/azure/azure-dev/cli/azd/pkg/azdext/contracts/v1beta;v1beta";

import "azd/extensions/v1beta/models.proto";

service UserConfigService {
  // Get retrieves a value by path
  rpc Get (GetUserConfigRequest) returns (GetUserConfigResponse);

  // GetString retrieves a value by path and returns it as a string
  rpc GetString (GetUserConfigStringRequest) returns (GetUserConfigStringResponse);

  // GetSection retrieves a section by path
  rpc GetSection (GetUserConfigSectionRequest) returns (GetUserConfigSectionResponse);

  // Set sets a value at a given path
  rpc Set (SetUserConfigRequest) returns (EmptyResponse);

  // Unset removes a value at a given path
  rpc Unset (UnsetUserConfigRequest) returns (EmptyResponse);

  // IsFeatureEnabled reports whether a feature is enabled in any source.
  // The host checks alpha.<id> user config, its process environment,
  // the azd environment dotenv values, and every azure.yaml service env.
  // Missing project or environment sources are skipped.
  rpc IsFeatureEnabled (IsFeatureEnabledRequest) returns (IsFeatureEnabledResponse);
}

// Request message for Get
message GetUserConfigRequest {
  string path = 1;
}

// Response message for Get
message GetUserConfigResponse {
  bytes value = 1;
  bool found = 2;
}

// Request message for GetString
message GetUserConfigStringRequest {
  string path = 1;
}

// Response message for GetString
message GetUserConfigStringResponse {
  string value = 1;
  bool found = 2;
}

// Request message for GetSection
message GetUserConfigSectionRequest {
  string path = 1;
}

// Response message for GetSection
message GetUserConfigSectionResponse {
  bytes section = 1;
  bool found = 2;
}

// Request message for Set
message SetUserConfigRequest {
  string path = 1;
  bytes value = 2;
}

// Request message for Unset
message UnsetUserConfigRequest {
  string path = 1;
}

// Request message for IsFeatureEnabled
message IsFeatureEnabledRequest {
  // Feature id, as in alpha.<id>. It does not need to be registered.
  string id = 1;
  // Optional environment variable name for the feature.
  // When empty, the registered name or AZD_ALPHA_ENABLE_<ID> is used.
  string env_var = 2;
  // Optional azd environment name. When empty, the default environment is used.
  string env_name = 3;
}

// Response message for IsFeatureEnabled
message IsFeatureEnabledResponse {
  bool enabled = 1;
}
