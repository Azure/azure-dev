version: "2"
linters:
  disable:
    - errcheck
  enable:
    - errorlint
    - forbidigo
    - gosec
    - lll
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: >-
            Use t.Log/t.Logf in tests instead of fmt.Print* to avoid
            corrupting go test -json output.
        - pattern: ^os\.Stdout$
          msg: >-
            Do not reference os.Stdout in tests; use io.Discard or a
            bytes.Buffer.
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    lll:
      line-length: 125
      tab-width: 4
    gosec:
      excludes:
        - G304
  exclusions:
    rules:
      - path-except: _test\.go$
        linters:
          - forbidigo
formatters:
  enable:
    - gofmt
