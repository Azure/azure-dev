trigger: none
pr: none

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    stages:
      - stage: DiagnoseAzPowerShell
        displayName: Diagnose Az PowerShell bootstrap
        jobs:
          - deployment: Authenticate
            displayName: Bootstrap modules and authenticate
            environment: none
            pool:
              name: azsdk-pool
              image: ubuntu-22.04
              os: linux
            templateContext:
              type: releaseJob
              isProduction: false
            strategy:
              runOnce:
                deploy:
                  steps:
                    - template: /eng/pipelines/templates/steps/ensure-az-powershell.yml

                    - task: AzurePowerShell@5
                      displayName: Authenticate with bootstrapped Az modules
                      inputs:
                        azureSubscription: Azure SDK Artifacts
                        azurePowerShellVersion: LatestVersion
                        pwsh: true
                        ScriptType: InlineScript
                        Inline: |
                          Write-Host "Authenticated Az.Accounts modules:"
                          Get-Module -Name Az.Accounts |
                            Select-Object Name, Version, Path |
                            Format-Table -AutoSize
                          $context = Get-AzContext
                          Write-Host "Authenticated account type: $($context.Account.Type)"
                          Write-Host "Authenticated environment: $($context.Environment.Name)"
