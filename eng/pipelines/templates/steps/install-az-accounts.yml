steps:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $requiredVersion = '5.5.3'
      $repositoryUrl = 'https://www.powershellgallery.com/api/v2'

      $repository = Get-PSRepository |
        Where-Object SourceLocation -eq $repositoryUrl |
        Select-Object -First 1
      if (-not $repository) {
        Register-PSRepository `
          -Name PowerShellGallery `
          -SourceLocation $repositoryUrl `
          -InstallationPolicy Trusted
        $repository = Get-PSRepository |
          Where-Object SourceLocation -eq $repositoryUrl |
          Select-Object -First 1
      }
      if (-not $repository) {
        throw "Failed to register the PowerShell repository at $repositoryUrl."
      }
      if ($repository.InstallationPolicy -ne 'Trusted') {
        Set-PSRepository -Name $repository.Name -InstallationPolicy Trusted
      }

      Install-Module `
        -Name Az.Accounts `
        -RequiredVersion $requiredVersion `
        -Repository $repository.Name `
        -Scope CurrentUser `
        -Force `
        -AllowClobber

      $module = Get-Module -Name Az.Accounts -ListAvailable |
        Where-Object Version -eq $requiredVersion |
        Select-Object -First 1
      if (-not $module) {
        throw "Az.Accounts $requiredVersion was not available after installation."
      }

      Write-Host "Installed Az.Accounts $($module.Version) at $($module.ModuleBase)"
    displayName: Install Az.Accounts
