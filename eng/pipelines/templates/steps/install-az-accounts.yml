steps:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $requiredVersion = '5.5.3'

      # Try to install Az.Accounts with retries (will use available package sources)
      $maxRetries = 3
      $retryCount = 0
      $installed = $false

      while ($retryCount -lt $maxRetries) {
        try {
          Write-Host "Attempt $($retryCount + 1)/$($maxRetries): Installing Az.Accounts $requiredVersion..."
          Install-Module `
            -Name Az.Accounts `
            -RequiredVersion $requiredVersion `
            -Scope CurrentUser `
            -Force `
            -AllowClobber `
            -ErrorAction Stop
          $installed = $true
          break
        } catch {
          $retryCount++
          if ($retryCount -ge $maxRetries) {
            throw "Failed to install Az.Accounts after $($maxRetries) attempts: $_"
          }
          Write-Host "Installation failed, retrying... Error: $_"
          Start-Sleep -Seconds 2
        }
      }

      if (-not $installed) {
        throw "Az.Accounts $requiredVersion installation did not complete."
      }

      $module = Get-Module -Name Az.Accounts -ListAvailable |
        Where-Object Version -eq $requiredVersion |
        Select-Object -First 1
      if (-not $module) {
        throw "Az.Accounts $requiredVersion was not available after installation."
      }

      Write-Host "Installed Az.Accounts $($module.Version) at $($module.ModuleBase)"
    displayName: Install Az.Accounts

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $archivePath = Join-Path $env:AGENT_TEMPDIRECTORY 'azcopy.tar.gz'
      $extractPath = Join-Path $env:AGENT_TEMPDIRECTORY 'azcopy'

      Invoke-WebRequest `
        -Uri 'https://aka.ms/downloadazcopy-v10-linux' `
        -OutFile $archivePath

      New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
      tar -xzf $archivePath -C $extractPath
      if ($LASTEXITCODE -ne 0) {
        throw "Failed to extract AzCopy."
      }

      $azCopy = Get-ChildItem -Path $extractPath -Filter azcopy -File -Recurse |
        Select-Object -First 1
      if (-not $azCopy) {
        throw "AzCopy was not available after installation."
      }

      chmod +x $azCopy.FullName
      Write-Host "##vso[task.prependpath]$($azCopy.DirectoryName)"
      & $azCopy.FullName --version
      if ($LASTEXITCODE -ne 0) {
        throw "Failed to run AzCopy after installation."
      }
    displayName: Install AzCopy
