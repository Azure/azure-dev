steps:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $archivePath = Join-Path $env:AGENT_TEMPDIRECTORY 'azcopy.tar.gz'
      $extractPath = Join-Path $env:AGENT_TEMPDIRECTORY 'azcopy'

      Invoke-WebRequest `
        -Uri 'https://aka.ms/downloadazcopy-v10-linux' `
        -OutFile $archivePath

      New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
      tar -xzf $archivePath -C $extractPath
      if ($LASTEXITCODE -ne 0) {
        throw "Failed to extract AzCopy."
      }

      $azCopy = Get-ChildItem -Path $extractPath -Filter azcopy -File -Recurse |
        Select-Object -First 1
      if (-not $azCopy) {
        throw "AzCopy was not available after installation."
      }

      chmod +x $azCopy.FullName
      Write-Host "##vso[task.prependpath]$($azCopy.DirectoryName)"
      & $azCopy.FullName --version
      if ($LASTEXITCODE -ne 0) {
        throw "Failed to run AzCopy after installation."
      }
    displayName: Install AzCopy
