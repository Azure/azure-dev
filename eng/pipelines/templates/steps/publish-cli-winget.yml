parameters:
  - name: GitHubToken
    type: string
    default: $(azuresdk-github-pat)
    displayName: GitHub token
  - name: ValidationMode
    type: boolean
    default: false
    displayName: Validate GitHub token without submitting

steps:
  - template: /eng/pipelines/templates/steps/set-metadata-variables.yml

  - pwsh: |
      $PSNativeCommandArgumentPassing = 'Legacy'
      Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      $AdditionalArgs = ""
      if ('${{ parameters.ValidationMode }}' -eq 'false' -and '$(SubmitWingetPackage)' -eq 'true') {
        $AdditionalArgs = "--submit"
      }

      ./wingetcreate.exe update `
        Microsoft.Azd `
        --version '1.34.200' `
        --urls "https://github.com/Azure/azure-dev/releases/download/azure-dev-cli_1.34.1/azd-windows-amd64.msi" `
        --token ${{ parameters.GitHubToken }} `
        --out winget
    displayName: Submit to WinGet
