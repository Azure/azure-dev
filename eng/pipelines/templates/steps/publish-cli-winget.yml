parameters:
  - name: Operation
    type: string
    default: Prepare
    values:
      - Prepare
      - Publish
  - name: WingetCreateVersion
    type: string
    default: v1.12.13.0
  - name: WingetCreateSha256
    type: string
    default: '24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea'

steps:
  - pwsh: |
      Write-Host "##vso[task.setvariable variable=CLI_VERSION]1.35.0"
      Write-Host "##vso[task.setvariable variable=MSI_VERSION]1.35.100"
      Write-Host "##vso[task.setvariable variable=SubmitWingetPackage]true"
    displayName: Override WinGet release metadata for 1.35.0 recovery

  - ${{ if eq(parameters.Operation, 'Prepare') }}:
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandArgumentPassing = 'Legacy'
        $wingetCreateVersion = '${{ parameters.WingetCreateVersion }}'
        $wingetCreateUrl = "https://github.com/microsoft/winget-create/releases/download/$wingetCreateVersion/wingetcreate.exe"
        Invoke-WebRequest $wingetCreateUrl -OutFile wingetcreate.exe
        $wingetCreateSha256 = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($wingetCreateSha256 -ne '${{ parameters.WingetCreateSha256 }}') {
          throw "WingetCreate checksum verification failed."
        }
        ./wingetcreate.exe --version

        $outputRoot = "winget"
        $manifestPath = "winget/manifests/m/Microsoft/Azd/$(MSI_VERSION)"

        ./wingetcreate.exe update `
          Microsoft.Azd `
          --version '$(MSI_VERSION)' `
          --urls "https://github.com/Azure/azure-dev/releases/download/azure-dev-cli_$(CLI_VERSION)/azd-windows-amd64.msi" `
          --out $outputRoot
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to generate the WinGet manifest."
        }

        if (!(Test-Path -Path $manifestPath -PathType Container)) {
          throw "WingetCreate did not generate the expected manifest directory: $manifestPath"
        }
      displayName: Generate and validate WinGet manifest

  - ${{ if eq(parameters.Operation, 'Publish') }}:
    - pwsh: |
        $manifestPath = "$(Pipeline.Workspace)/winget/manifests/m/Microsoft/Azd/$(MSI_VERSION)"
        if (!(Test-Path -Path $manifestPath -PathType Container)) {
          throw "WinGet manifest artifact was not downloaded to the expected directory: $manifestPath"
        }

        $expectedManifestFiles = @(
          'Microsoft.Azd.yaml',
          'Microsoft.Azd.installer.yaml',
          'Microsoft.Azd.locale.en-US.yaml'
        )
        foreach ($manifestFile in $expectedManifestFiles) {
          $manifestFilePath = Join-Path $manifestPath $manifestFile
          if (!(Test-Path -Path $manifestFilePath -PathType Leaf)) {
            throw "WinGet manifest artifact is missing required file: $manifestFilePath"
          }

          $manifestContent = Get-Content -Path $manifestFilePath -Raw
          if ($manifestContent -notmatch '(?m)^PackageIdentifier:\s+Microsoft\.Azd\s*$') {
            throw "WinGet manifest has an unexpected package identifier: $manifestFilePath"
          }
          if ($manifestContent -notmatch "(?m)^PackageVersion:\s+$(MSI_VERSION)\s*$") {
            throw "WinGet manifest has an unexpected package version: $manifestFilePath"
          }
        }

        $installerManifestPath = Join-Path $manifestPath 'Microsoft.Azd.installer.yaml'
        $installerManifestContent = Get-Content -Path $installerManifestPath -Raw
        $expectedInstallerUrl = "https://github.com/Azure/azure-dev/releases/download/azure-dev-cli_$(CLI_VERSION)/azd-windows-amd64.msi"
        if ($installerManifestContent -notmatch "(?m)^  InstallerUrl:\s+$([regex]::Escape($expectedInstallerUrl))\s*$") {
          throw "WinGet installer manifest does not reference the expected release asset."
        }

        Get-ChildItem -Path $manifestPath
      displayName: Validate downloaded WinGet manifest

    - task: EsrpRelease@12
      displayName: Generate WinGet CDN download link
      condition: >-
        and(
          succeeded(),
          eq(variables['SubmitWingetPackage'], 'true')
        )
      inputs:
        connectedservicename: Azure SDK PME Managed Identity
        usemanagedidentity: true
        keyvaultname: kv-azuresdk-codesign
        signcertname: azure-sdk-esrp-release-certificate
        clientid: 5f81938c-2544-4f1f-9251-dd9de5b8a81b
        intent: filedownloadlinkgeneration
        contenttype: WingetExternal
        contentsource: Folder
        folderlocation: $(Pipeline.Workspace)/winget
        waitforreleasecompletion: true
        owners: chononiw@microsoft.com
        approvers: chononiw@microsoft.com
        serviceendpointurl: https://api.esrp.microsoft.com
        mainpublisher: ESRPRELPACMAN
        domaintenantid: 975f013f-7f24-47e8-a7d3-abc4752bf346

    - task: EsrpRelease@12
      displayName: Publish WinGet manifest
      condition: >-
        and(
          succeeded(),
          eq(variables['SubmitWingetPackage'], 'true')
        )
      inputs:
        connectedservicename: Azure SDK PME Managed Identity
        usemanagedidentity: true
        keyvaultname: kv-azuresdk-codesign
        signcertname: azure-sdk-esrp-release-certificate
        clientid: 5f81938c-2544-4f1f-9251-dd9de5b8a81b
        intent: Winget
        contenttype: manifest
        contentsource: Folder
        folderlocation: $(Pipeline.Workspace)/winget
        waitforreleasecompletion: true
        owners: chononiw@microsoft.com
        approvers: chononiw@microsoft.com
        serviceendpointurl: https://api.esrp.microsoft.com
        mainpublisher: ESRPRELPACMAN
        domaintenantid: 975f013f-7f24-47e8-a7d3-abc4752bf346
