parameters:
  - name: PublishUploadLocations
    type: string
  - name: StorageContainerName
    type: string
    default: '`$web'

steps:
  - pwsh: |
      if (Test-Path -Path release/_manifest) {
        Remove-Item -Path release/_manifest -Recurse -Force
      }
      Write-Host "Release:"
      Get-ChildItem -Recurse release/ | Select-Object -Property Length,FullName
    displayName: Remove _manifest folder

  #- template: /eng/pipelines/templates/steps/install-azcopy.yml

  - ${{ each location in split(parameters.PublishUploadLocations, ';') }}:
    - task: AzureFileCopy@5
      displayName: Upload release to ${{ location }}
      inputs:
        SourcePath: 'release/'
        azureSubscription: 'Azure SDK Artifacts'
        Destination: AzureBlob
        storage: '$(publish-storage-account)'
        ContainerName: '${{ parameters.StorageContainerName }}'
        BlobPrefix: 'azd/extensions/${{ location }}'