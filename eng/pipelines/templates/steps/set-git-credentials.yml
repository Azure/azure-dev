parameters:
  Username: azure-sdk
  Email: azuresdk@microsoft.com
  GitHubPat: $(azuresdk-github-pat)
  # Use x-access-token for GitHub App tokens. Defaults to Username.
  CredentialUsername: ''

steps:
  - pwsh: |
      git config --global user.name "${{ parameters.Username }}"
      git config --global user.email "${{ parameters.Email }}"
      Set-Content `
        -Value "https://${{ coalesce(parameters.CredentialUsername, parameters.Username) }}:${{ parameters.GitHubPat }}@github.com" `
        -Path ~/.git-credentials
      git config --global credential.helper "store"
    displayName: Set global git credentials
